name: LOOX responsive and static UI audit
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/site-ui-audit.yml"
      - "scripts/site-ui-static-audit.py"
      - "scripts/site-responsive-audit.mjs"
      - "scripts/privacy-consent-audit.mjs"
      - "scripts/account-security-audit.mjs"
      - "platform/notifications*"
      - "platform/privacy-data.js"
      - "platform/account-security.js"
      - "tests/account-security.test.mjs"
      - "tests/*.test.mjs"
      - "platform/auth-storage.js"
      - "tests/privacy-data.test.mjs"
      - "settings.html"
      - "platform/settings-2.js"
      - "platform/settings-2.css"
      - "platform/generation-preferences.js"
      - "scripts/settings-2-audit.mjs"
      - "platform/privacy.js"
      - "platform/privacy.css"
      - "platform/account.js"
      - "cookie-settings.html"
      - "scripts/billing-ui-audit.mjs"
      - "scripts/desktop-studio-audit.mjs"
      - "platform/desktop-studio.css"
      - "platform/loox-model-picker.js"
      - "platform/account-pages.js"
      - "platform/loox-video-generator.js"
      - "ai-text-to-image.html"
      - "ai-video-generator.html"
      - "ai-chat.html"
      - "upgrade.html"
      - "loox-sitewide-nav.css"
      - "loox-sitewide-nav.js"
      - "platform/template-gallery.css"
      - "platform/community.css"
      - "platform/trending-feed.css"
      - "design-studio-pro-v2.css"
      - "loox-photo-editor.css"
      - "templates.html"
      - "design-studio.html"
      - "photo-editor.html"
permissions:
  contents: read
jobs:
  site-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Audit every root and learning page for missing references and duplicate IDs
        run: python3 scripts/site-ui-static-audit.py
      - name: Install ephemeral browser testing dependency
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@latest
      - name: Locate a headless browser
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          elif command -v chromium >/dev/null 2>&1; then
            chromium --version
          else
            npx playwright install chromium
          fi
      - name: Verify authenticated account security and export UI with synthetic data
        run: |
          python3 -m http.server 8766 --bind 127.0.0.1 >/tmp/loox-security-audit-server.log 2>&1 &
          LOOX_AUDIT_URL=http://127.0.0.1:8766/ node scripts/account-security-audit.mjs
      - name: Verify Settings 2.0 categories, search and preference persistence
        run: LOOX_AUDIT_URL=http://127.0.0.1:8766/ node scripts/settings-2-audit.mjs
      - name: Run responsive overflow and interaction checks
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/loox-ui-audit-server.log 2>&1 &
          sleep 2
          node scripts/site-responsive-audit.mjs
      - name: Verify privacy choices and mobile consent dialogs
        run: node scripts/privacy-consent-audit.mjs
      - name: Run frontend regression tests
        run: node --test tests/*.test.mjs
      - name: Upload report and failure screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: loox-site-ui-audit
          path: |
            site-audit-results.json
            audit-artifacts/
          if-no-files-found: warn
  desktop-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.58.2
      - name: Check desktop generation and plan flows without paid requests
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/loox-desktop-server.log 2>&1 &
          node scripts/desktop-studio-audit.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: loox-desktop-studio-audit
          path: desktop-audit-artifacts/

  billing-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.58.2
      - name: Verify monthly billing, disabled recharge and retained mobile apps navigation
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/loox-billing-server.log 2>&1 &
          node scripts/billing-ui-audit.mjs
