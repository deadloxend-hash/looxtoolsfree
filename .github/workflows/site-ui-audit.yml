name: LOOX responsive and static UI audit
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/site-ui-audit.yml"
      - "scripts/site-ui-static-audit.py"
      - "scripts/site-responsive-audit.mjs"
      - "scripts/desktop-studio-audit.mjs"
      - "platform/desktop-studio.css"
      - "platform/loox-model-picker.js"
      - "platform/account-pages.js"
      - "platform/loox-video-generator.js"
      - "ai-text-to-image.html"
      - "ai-video-generator.html"
      - "ai-chat.html"
      - "upgrade.html"
      - "loox-sitewide-nav.css"
      - "loox-sitewide-nav.js"
      - "platform/template-gallery.css"
      - "platform/community.css"
      - "platform/trending-feed.css"
      - "design-studio-pro-v2.css"
      - "loox-photo-editor.css"
      - "templates.html"
      - "design-studio.html"
      - "photo-editor.html"
permissions:
  contents: read
jobs:
  site-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit every root and learning page for missing references and duplicate IDs
        run: python3 scripts/site-ui-static-audit.py
      - name: Install ephemeral browser testing dependency
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@latest
      - name: Locate a headless browser
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          elif command -v chromium >/dev/null 2>&1; then
            chromium --version
          else
            npx playwright install chromium
          fi
      - name: Run responsive overflow and interaction checks
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/loox-ui-audit-server.log 2>&1 &
          sleep 2
          node scripts/site-responsive-audit.mjs
      - name: Upload report and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loox-site-ui-audit
          path: |
            site-audit-results.json
            audit-artifacts/
          if-no-files-found: warn
  desktop-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.58.2
      - name: Check desktop generation and plan flows without paid requests
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/loox-desktop-server.log 2>&1 &
          node scripts/desktop-studio-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loox-desktop-studio-audit
          path: desktop-audit-artifacts/
