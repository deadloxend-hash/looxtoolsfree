name: Publish consistent LOOX logo styling on every page
on:
  push:
    paths:
      - ".github/workflows/loox-logo-rollout.yml"
      - "scripts/sync-logo-css-version.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh-logo-style-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Refresh the shared logo stylesheet across all HTML pages
        run: python3 scripts/sync-logo-css-version.py
      - name: Commit only HTML changes
        run: |
          git config user.name "loox-logo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- '*.html'
          if git diff --cached --quiet; then
            echo "Every HTML page already references the latest LOOX logo stylesheet."
            exit 0
          fi
          git commit -m "Load unified LOOX logo CSS on all pages"
          git push
