name: AI Video landing preview checks
on:
  workflow_dispatch:
  push:
    paths:
      - "ai-video-landing.html"
      - "platform/video-first-creation.*"
      - "platform/creative-landing.js"
      - "platform/aspect-controls.js"
      - "scripts/video-landing-audit.mjs"
      - ".github/workflows/video-landing-check.yml"
permissions:
  contents: read
jobs:
  video-landing:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.58.2
      - run: |
          if ! command -v google-chrome >/dev/null 2>&1; then npx playwright install chromium; fi
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/loox-video-landing.log 2>&1 &
          sleep 2
          node scripts/video-landing-audit.mjs
