name: Editor JavaScript check
on:
  push:
    paths: ['loox-video-studio.js', 'loox-video-core.js', 'tests/video-core.test.cjs', 'loox-crop-controls.js', '.github/workflows/editor-check.yml']
  pull_request:
    paths: ['loox-video-studio.js', 'loox-video-core.js', 'tests/video-core.test.cjs', 'loox-crop-controls.js', '.github/workflows/editor-check.yml']
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: node --check loox-video-studio.js && node --check loox-video-core.js && node --check loox-crop-controls.js
      - run: node --test tests/video-core.test.cjs
