name: Synchronize LOOX navigation
on:
  push:
    paths:
      - ".github/workflows/loox-navigation-rollout.yml"
      - "scripts/apply-uniform-nav.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply-sitewide-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out LOOX Tools
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Add the navigation to every root HTML page
        run: python3 scripts/apply-uniform-nav.py
      - name: Commit updated pages
        run: |
          git config user.name "loox-navigation-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' 'learn/*/*.html'
          if git diff --cached --quiet; then
            echo "Every root page is already up to date."
            exit 0
          fi
          git commit -m "Apply identical LOOX top navigation to site pages"
          git push
