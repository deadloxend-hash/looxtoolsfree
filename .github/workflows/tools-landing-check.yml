name: LOOX All Tools landing page checks
on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "loox-tools-landing-2026.css"
      - "scripts/tools-landing-audit.mjs"
      - ".github/workflows/tools-landing-check.yml"
permissions:
  contents: read
jobs:
  landing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Validate Utilities discovery and preserve editing assets
        run: |
          node --check scripts/tools-landing-audit.mjs
          node --check platform/utilities.js
          node --test tests/utilities-core.test.cjs
          node scripts/audit-utilities.cjs
          node scripts/build-utilities.cjs
          git diff --exit-code -- index.html
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          for(const cover of ['photo-editor.webp','video-editor.webp','bg-remove.webp'])
            assert.ok(fs.existsSync('assets/tool-art/'+cover),'Preserve editing tool artwork: '+cover);
          JS
      - name: Check static links and duplicated IDs
        run: python3 scripts/site-ui-static-audit.py
      - name: Install Playwright
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
      - name: Locate Chromium
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          else
            npx playwright install --with-deps chromium
          fi
      - name: Test Utilities at all eight requested viewport widths
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/loox-tools-audit.log 2>&1 &
          sleep 2
          node scripts/tools-landing-audit.mjs
      - name: Save desktop and mobile visual captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: loox-tools-landing-visuals
          path: audit-artifacts/tools-home-*.png
          if-no-files-found: ignore
