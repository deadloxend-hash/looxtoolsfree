name: Authentication and Google OAuth checks
on:
  workflow_dispatch:
  push:
    paths: ['platform/account*.js', 'platform/auth*', 'auth-callback.html', 'account.html', 'platform/settings-2.js', 'scripts/authentication-audit.mjs', 'tests/auth*.test.mjs', '.github/workflows/authentication-check.yml']
  pull_request:
    paths: ['platform/account*.js', 'platform/auth*', 'auth-callback.html', 'account.html', 'platform/settings-2.js', 'scripts/authentication-audit.mjs', 'tests/auth*.test.mjs', '.github/workflows/authentication-check.yml']
permissions:
  contents: read
jobs:
  authentication:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: node --test tests/*.test.mjs tests/*.test.cjs
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.58.2
      - name: Locate or install browser
        run: command -v google-chrome || npx playwright install chromium
      - name: Exercise real SDK against intercepted authentication services
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/loox-auth-http.log 2>&1 &
          node scripts/authentication-audit.mjs
