<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Background Remover - LOOX Utility Kit</title>
  <style>
    :root {
      --bg-dark: #0b0d14;
      --sidebar-bg: #08090d;
      --card-bg: #131722;
      --card-border: #1e2436;
      --accent-pink: #ec4899;
      --accent-purple: #8b5cf6;
      --accent-blue: #3b82f6;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; overflow-x: hidden; }

    /* Left Sidebar */
    aside { width: 260px; background-color: var(--sidebar-bg); border-right: 1px solid var(--card-border); display: flex; flex-direction: column; padding: 20px; position: fixed; height: 100vh; z-index: 10; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.2rem; margin-bottom: 30px; color: #fff; text-decoration: none; }
    .brand-icon { width: 32px; height: 32px; background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple)); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
    .brand span { background: linear-gradient(to right, #ffffff, #a5b4fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .nav-section-title { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; font-weight: 700; }
    .nav-links { display: flex; flex-direction: column; gap: 5px; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 8px; color: var(--text-muted); text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: 0.2s; cursor: pointer; border: 1px solid transparent; }
    .nav-item:hover { background: rgba(255,255,255,0.03); color: #fff; }
    .nav-item.active { background: rgba(236, 72, 153, 0.1); border-color: rgba(236, 72, 153, 0.3); color: #fff; }

    /* Main Content Area */
    main { margin-left: 260px; flex: 1; padding: 40px; display: flex; flex-direction: column; min-height: 100vh; }
    @media (max-width: 900px) {
      aside { width: 70px; padding: 15px 10px; }
      aside .brand span, aside .nav-section-title, aside .nav-item span { display: none; }
      main { margin-left: 70px; padding: 20px; }
    }

    .hero { margin-bottom: 25px; }
    .hero h1 { font-size: 2.2rem; font-weight: 900; margin-bottom: 8px; }
    .gradient-text { background: linear-gradient(135deg, var(--accent-pink) 0%, var(--accent-purple) 50%, var(--accent-blue) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .hero p { color: var(--text-muted); font-size: 0.95rem; }

    .workspace-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); flex: 1; display: flex; flex-direction: column; }

    .upload-area { border: 2px dashed rgba(236, 72, 153, 0.4); border-radius: 12px; padding: 50px 20px; text-align: center; cursor: pointer; transition: 0.2s; background: rgba(0,0,0,0.2); margin: auto 0; }
    .upload-area:hover { border-color: var(--accent-pink); background: rgba(236, 72, 153, 0.03); }
    .upload-area input { display: none; }

    .editor-layout { display: none; grid-template-columns: 1fr 300px; gap: 20px; margin-top: 15px; }
    @media (max-width: 950px) { .editor-layout { grid-template-columns: 1fr; } }

    .canvas-wrapper { position: relative; background-color: #08090d; border-radius: 10px; display: flex; align-items: center; justify-content: center; min-height: 400px; overflow: hidden; border: 1px solid var(--card-border); }
    .checkerboard { background-image: linear-gradient(45deg, #181b26 25%, transparent 25%), linear-gradient(-45deg, #181b26 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #181b26 75%), linear-gradient(-45deg, transparent 75%, #181b26 75%); background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0px; }
    canvas { max-width: 100%; max-height: 480px; cursor: crosshair; }

    .controls { display: flex; flex-direction: column; gap: 15px; }
    .tabs { display: flex; background: #08090d; border-radius: 8px; padding: 4px; border: 1px solid var(--card-border); }
    .tab-btn { flex: 1; padding: 9px; background: none; border: none; color: var(--text-muted); font-weight: 600; cursor: pointer; border-radius: 6px; font-size: 0.85rem; }
    .tab-btn.active { background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple)); color: #fff; }

    .tool-group { background: rgba(0,0,0,0.2); padding: 16px; border-radius: 10px; border: 1px solid var(--card-border); }
    .tool-group h4 { margin-bottom: 12px; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 0.9rem; }
    .btn-primary { background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple)); color: #fff; box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3); }
    .btn-primary:hover { opacity: 0.9; }
    .btn-secondary { background: rgba(255,255,255,0.06); color: #fff; border: 1px solid var(--card-border); }
    .btn-secondary:hover { background: rgba(255,255,255,0.1); }
    .btn-toggle { background: #1a1f2e; color: #ccc; margin-bottom: 8px; border: 1px solid var(--card-border); }
    .btn-toggle.active { background: #10b981; color: #fff; border-color: #10b981; }

    .color-pickers { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
    .color-btn { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #333; cursor: pointer; }

    .loader { display: none; text-align: center; padding: 40px; color: #f472b6; font-weight: 700; font-size: 1.1rem; }
  </style>
</head>
<body>

  <!-- Left Sidebar Navigation -->
  <aside>
    <a href="index.html" class="brand">
      <div class="brand-icon">⚡</div>
      <span>LOOX Kit</span>
    </a>

    <div class="nav-section-title">Tools Hub</div>
    <div class="nav-links">
      <a href="index.html" class="nav-item">
        <span>🏠</span>
        <span>Dashboard Hub</span>
      </a>
      <a href="bg-remove.html" class="nav-item active">
        <span>✂️</span>
        <span>Background Remover</span>
      </a>
    </div>
  </aside>

  <!-- Main Content -->
  <main>
    <div class="hero">
      <h1>AI Background <span class="gradient-text">Remover</span></h1>
      <p>Instant studio-grade cutout precision powered by advanced cloud AI.</p>
    </div>

    <div class="workspace-card">
      <!-- Upload Box -->
      <div class="upload-area" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <h3 style="font-size: 1.2rem; margin-bottom: 5px;">📁 Click or Drag Image Here</h3>
        <p style="color: var(--text-muted); font-size: 0.85rem;">Supports PNG, JPG, WebP (Max 4.5MB)</p>
        <input type="file" id="fileInput" accept="image/*">
      </div>

      <!-- Loading State -->
      <div class="loader" id="loader">
        ⚡ Processing with Cloud AI... Please wait.
      </div>

      <!-- Canvas Editor Layout -->
      <div class="editor-layout" id="editorLayout">
        <div class="canvas-wrapper checkerboard" id="canvasWrapper">
          <canvas id="mainCanvas"></canvas>
        </div>

        <div class="controls">
          <div class="tabs">
            <button class="tab-btn active" id="tabRemoved" onclick="switchTab('removed')">Removed</button>
            <button class="tab-btn" id="tabOriginal" onclick="switchTab('original')">Original</button>
          </div>

          <div class="tool-group">
            <h4>Manual Touch-Up</h4>
            <button class="btn btn-toggle" id="eraseBtn" onclick="setTool('erase')">🧹 Erase Brush</button>
            <button class="btn btn-toggle" id="restoreBtn" onclick="setTool('restore')">🖌️ Restore Brush</button>
            
            <label style="font-size: 0.8rem; color: var(--text-muted); margin-top: 10px; display: block;">Brush Size:</label>
            <input type="range" id="brushSize" min="5" max="80" value="20" style="width: 100%;">
          </div>

          <div class="tool-group">
            <h4>Background Color</h4>
            <div class="color-pickers">
              <div class="color-btn" style="background: transparent;" onclick="setBgColor('transparent')" title="Transparent"></div>
              <div class="color-btn" style="background: #ffffff;" onclick="setBgColor('#ffffff')" title="White"></div>
              <div class="color-btn" style="background: #000000;" onclick="setBgColor('#000000')" title="Black"></div>
              <div class="color-btn" style="background: #3b82f6;" onclick="setBgColor('#3b82f6')" title="Blue"></div>
              <input type="color" id="customBgColor" onchange="setBgColor(this.value)" style="width: 30px; height: 30px; border:none; cursor:pointer; background:none;">
            </div>
          </div>

          <button class="btn btn-primary" onclick="downloadImage()">⬇️ Download PNG</button>
          <button class="btn btn-secondary" onclick="resetApp()">🔄 New Image</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const loader = document.getElementById('loader');
    const editorLayout = document.getElementById('editorLayout');
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');

    let originalImg = new Image();
    let cutoutImg = new Image();
    let currentTool = null; 
    let isDrawing = false;
    let bgColor = 'transparent';
    let currentTab = 'removed';

    dropZone.addEventListener('dragover', (e) => e.preventDefault());
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });

    fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

    async function handleFile(file) {
      if (!file) return;
      
      dropZone.style.display = 'none';
      loader.style.display = 'block';

      const fileUrl = URL.createObjectURL(file);
      await loadOriginal(fileUrl);

      try {
        const formData = new FormData();
        formData.append('image_file', file);

        const vercelEndpoint = 'https://looxtoolfree-backend.vercel.app/api/remove-bg';

        const response = await fetch(vercelEndpoint, {
          method: 'POST',
          body: formData
        });

        if (!response.ok) {
          throw new Error('Cloud processing failed.');
        }

        const blob = await response.blob();
        const cutoutUrl = URL.createObjectURL(blob);
        
        cutoutImg.onload = () => {
          loader.style.display = 'none';
          editorLayout.style.display = 'grid';
          renderCanvas();
        };
        cutoutImg.src = cutoutUrl;
      } catch (err) {
        console.error(err);
        alert("Failed to process image through Vercel proxy.");
        loader.style.display = 'none';
        dropZone.style.display = 'block';
      }
    }

    function loadOriginal(url) {
      return new Promise((resolve) => {
        originalImg.onload = resolve;
        originalImg.src = url;
      });
    }

    function renderCanvas() {
      canvas.width = originalImg.width;
      canvas.height = originalImg.height;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (currentTab === 'original') {
        ctx.drawImage(originalImg, 0, 0);
        return;
      }

      if (bgColor !== 'transparent') {
        ctx.fillStyle = bgColor;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      ctx.drawImage(cutoutImg, 0, 0);
    }

    window.setTool = function(tool) {
      currentTool = currentTool === tool ? null : tool;
      document.getElementById('eraseBtn').classList.toggle('active', currentTool === 'erase');
      document.getElementById('restoreBtn').classList.toggle('active', currentTool === 'restore');
    };

    canvas.addEventListener('mousedown', () => isDrawing = true);
    window.addEventListener('mouseup', () => isDrawing = false);
    canvas.addEventListener('mousemove', draw);

    function draw(e) {
      if (!isDrawing || !currentTool || currentTab === 'original') return;

      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      const x = (e.clientX - rect.left) * scaleX;
      const y = (e.clientY - rect.top) * scaleY;
      const radius = document.getElementById('brushSize').value;

      const offCanvas = document.createElement('canvas');
      offCanvas.width = canvas.width;
      offCanvas.height = canvas.height;
      const offCtx = offCanvas.getContext('2d');

      offCtx.drawImage(cutoutImg, 0, 0);
      offCtx.beginPath();
      offCtx.arc(x, y, radius, 0, Math.PI * 2);

      if (currentTool === 'erase') {
        offCtx.globalCompositeOperation = 'destination-out';
        offCtx.fill();
      } else if (currentTool === 'restore') {
        offCtx.globalCompositeOperation = 'source-over';
        offCtx.save();
        offCtx.clip();
        offCtx.drawImage(originalImg, 0, 0);
        offCtx.restore();
      }

      const updatedImg = new Image();
      updatedImg.onload = () => {
        cutoutImg = updatedImg;
        renderCanvas();
      };
      updatedImg.src = offCanvas.toDataURL();
    }

    window.switchTab = function(tab) {
      currentTab = tab;
      document.getElementById('tabRemoved').classList.toggle('active', tab === 'removed');
      document.getElementById('tabOriginal').classList.toggle('active', tab === 'original');
      renderCanvas();
    };

    window.setBgColor = function(color) {
      bgColor = color;
      renderCanvas();
    };

    window.downloadImage = function() {
      const link = document.createElement('a');
      link.download = 'loox-bg-removed.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    };

    window.resetApp = function() {
      fileInput.value = '';
      editorLayout.style.display = 'none';
      dropZone.style.display = 'block';
      loader.style.display = 'none';
      currentTool = null;
      document.getElementById('eraseBtn').classList.remove('active');
      document.getElementById('restoreBtn').classList.remove('active');
    };
  </script>
</body>
</html>
