<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Edit photos with LOOX Photo Editor."><title>LOOX Photo Editor</title><style>
:root{--bg:#0b0d14;--panel:#141827;--line:#2a3043;--pink:#ec4899;--purple:#8b5cf6;--muted:#a7afc0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f8fafc;font:15px Inter,system-ui,sans-serif}.top{height:64px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;background:#0d1019;border-bottom:1px solid var(--line)}a{color:#f9a8d4;text-decoration:none}.brand{color:white;font-weight:900;font-size:19px}.brand b{color:#f472b6}.app{max-width:1200px;margin:auto;padding:20px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}.preview,.controls{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}.preview{display:grid;place-items:center;min-height:65vh;overflow:hidden;background:radial-gradient(#252b3c 1px,transparent 1px);background-size:18px 18px}.preview img{display:none;max-width:100%;max-height:70vh;object-fit:contain;filter:none}.controls h1{font-size:20px;margin:0 0 15px}label{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin:17px 0 7px}input[type=range]{width:100%;accent-color:var(--pink)}input[type=file]{width:100%;font-size:12px}button{border:0;border-radius:10px;padding:11px 14px;background:linear-gradient(120deg,var(--pink),var(--purple));color:white;font-weight:800;cursor:pointer}.secondary{background:#252c40;border:1px solid #3a435b}.row{display:flex;gap:8px;flex-wrap:wrap;margin:13px 0}.row button{flex:1}.note{font-size:12px;color:var(--muted);line-height:1.5}@media(max-width:760px){.app{display:flex;flex-direction:column;padding:10px}.preview{min-height:38vh;order:1}.controls{order:2}.preview img{max-height:45vh}.top{padding:0 12px}}
</style>  <link rel="stylesheet" href="loox-tool-ui.css?v=2">
</head><body><header class="top"><a class="brand" href="index.html">⚡ LOOX <b>Photo Editor</b></a><a href="index.html">← All tools</a></header><main class="app"><section class="preview"><div style="text-align:center;width:100%"><img id="photo" alt="Photo preview"><p id="empty" style="color:#a7afc0">Choose a photo to start editing</p></div></section><section class="controls"><h1>Edit your photo</h1><input type="file" id="file" accept="image/*"><label>Brightness <output id="bv">100%</output></label><input id="brightness" type="range" min="0" max="200" value="100"><label>Contrast <output id="cv">100%</output></label><input id="contrast" type="range" min="0" max="200" value="100"><label>Saturation <output id="sv">100%</output></label><input id="saturation" type="range" min="0" max="200" value="100"><label>Blur <output id="blv">0px</output></label><input id="blur" type="range" min="0" max="12" value="0"><div class="row"><button class="secondary" id="rotate">↻ Rotate</button><button class="secondary" id="flip">⇋ Flip</button><button class="secondary" id="reset">Reset</button></div><button id="download" style="width:100%">Download edited photo</button><p class="note">Your photo is edited locally in this browser and is not uploaded to LOOX. Large photos may take a moment to export.</p></section></main>
<script>
const img=document.getElementById('photo');let src=null,rotation=0,flip=1;const ids=['brightness','contrast','saturation','blur'];function apply(){const b=+brightness.value,c=+contrast.value,s=+saturation.value,bl=+blur.value;img.style.filter='brightness('+b+'%) contrast('+c+'%) saturate('+s+'%) blur('+bl+'px)';img.style.transform='rotate('+rotation+'deg) scaleX('+flip+')';bv.textContent=b+'%';cv.textContent=c+'%';sv.textContent=s+'%';blv.textContent=bl+'px'}document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(!f)return;if(src)URL.revokeObjectURL(src);src=URL.createObjectURL(f);img.onload=()=>{img.style.display='block';empty.style.display='none';rotation=0;flip=1;ids.forEach(id=>document.getElementById(id).value=id==='blur'?0:100);apply()};img.src=src};ids.forEach(id=>document.getElementById(id).oninput=apply);document.getElementById('rotate').onclick=()=>{rotation=(rotation+90)%360;apply()};document.getElementById('flip').onclick=()=>{flip*=-1;apply()};document.getElementById('reset').onclick=()=>{rotation=0;flip=1;ids.forEach(id=>document.getElementById(id).value=id==='blur'?0:100);apply()};document.getElementById('download').onclick=()=>{if(!img.naturalWidth)return alert('Choose a photo first.');const swap=Math.abs(rotation)%180===90,w=swap?img.naturalHeight:img.naturalWidth,h=swap?img.naturalWidth:img.naturalHeight,canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const x=canvas.getContext('2d');x.filter='brightness('+brightness.value+'%) contrast('+contrast.value+'%) saturate('+saturation.value+'%) blur('+blur.value+'px)';x.translate(w/2,h/2);x.rotate(rotation*Math.PI/180);x.scale(flip,1);x.drawImage(img,-img.naturalWidth/2,-img.naturalHeight/2);canvas.toBlob(blob=>{if(!blob)return alert('Could not export this photo.');const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='loox-edited-photo.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),30000)},'image/png')};apply();
</script>  <script src="loox-tool-guides.js?v=1"></script>
  <script src="loox-tool-ui.js?v=2"></script>
</body></html>
