<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Create social graphics, stories and thumbnails in LOOX Design Studio."><title>LOOX Design Studio</title>
<style>
:root{color-scheme:dark;--bg:#0b0d14;--panel:#141827;--line:#2a3043;--pink:#ec4899;--purple:#8b5cf6;--muted:#a7afc0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f8fafc;font:15px Inter,system-ui,sans-serif}.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);background:#0d1019;position:sticky;top:0;z-index:3}.brand{font-weight:900;text-decoration:none;color:white;font-size:19px}.brand b{color:#f472b6}.top a:last-child{color:#f9a8d4;text-decoration:none}.app{max-width:1400px;margin:auto;padding:18px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px}.tools,.stage{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:17px}.tools h2{font-size:17px;margin:0 0 15px}.group{padding:12px 0;border-top:1px solid var(--line)}label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}input,select,button{font:inherit}input[type=text],input[type=number],select{width:100%;padding:10px;border:1px solid #384057;background:#0d1220;color:white;border-radius:9px;margin-bottom:10px}input[type=color]{width:100%;height:38px;border:0;background:none}input[type=file]{width:100%;font-size:12px;margin:5px 0 10px}.btn{border:0;border-radius:10px;padding:10px 13px;background:linear-gradient(120deg,var(--pink),var(--purple));color:white;font-weight:800;cursor:pointer}.btn.alt{background:#252c40;border:1px solid #3a435b}.actions{display:flex;gap:8px;flex-wrap:wrap}.stage{min-width:0}.stagehead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}.stagehead h1{font-size:20px;margin:0}.canvaswrap{min-height:68vh;display:grid;place-items:center;padding:16px;background:radial-gradient(#252b3c 1px,transparent 1px);background-size:18px 18px;border-radius:12px;overflow:auto}canvas{max-width:100%;height:auto;max-height:75vh;box-shadow:0 14px 50px #0009;background:white;touch-action:manipulation}.hint{font-size:12px;color:var(--muted);line-height:1.5}.presets{display:grid;grid-template-columns:1fr 1fr;gap:7px}.presets button{font-size:12px}@media(max-width:760px){.app{display:flex;flex-direction:column;padding:10px}.tools{order:2}.stage{order:1}.canvaswrap{min-height:42vh;padding:8px}.top{padding:0 12px}.stagehead h1{font-size:17px}} 
</style>  <link rel="stylesheet" href="loox-tool-ui.css?v=2">
</head><body><header class="top"><a class="brand" href="index.html">⚡ LOOX <b>Design Studio</b></a><a href="index.html">← All tools</a></header>
<div class="app"><section class="tools"><h2>Design controls</h2><div class="group"><label>Canvas size</label><div class="presets"><button class="btn alt" data-size="1080,1080">Post 1:1</button><button class="btn alt" data-size="1080,1920">Story 9:16</button><button class="btn alt" data-size="1280,720">YouTube 16:9</button><button class="btn alt" data-size="1200,628">Banner</button></div></div>
<div class="group"><label>Background</label><input type="color" id="bg" value="#ffffff"></div>
<div class="group"><label>Add text</label><input id="txt" type="text" placeholder="Your headline"><label>Text color</label><input type="color" id="tc" value="#171717"><label>Text size</label><input type="number" id="ts" value="72" min="12" max="220"><div class="actions"><button class="btn" id="addText">Add text</button><button class="btn alt" id="addShape">Add shape</button></div></div>
<div class="group"><label>Upload image</label><input type="file" id="image" accept="image/*"><p class="hint">Uploaded image is placed in the center. You can add more text and shapes around it.</p></div>
<div class="group"><label>Selected text</label><label>Horizontal position (%)</label><input type="range" id="x" min="0" max="100" value="50"><label>Vertical position (%)</label><input type="range" id="y" min="0" max="100" value="50"><div class="actions"><button class="btn alt" id="delete">Delete selected</button><button class="btn alt" id="clear">Clear design</button></div></div>
<div class="group"><button class="btn" id="download">Download PNG</button></div><p class="hint">Tip: Add an element, then adjust its position with the sliders. This lightweight editor is designed for quick graphics.</p></section>
<section class="stage"><div class="stagehead"><h1>Your canvas</h1><span class="hint" id="sizeLabel">1080 × 1080</span></div><div class="canvaswrap"><canvas id="canvas" width="1080" height="1080"></canvas></div></section></div>
<script>
const c=document.getElementById('canvas'),ctx=c.getContext('2d');let bg='#ffffff',items=[],selected=-1;
function draw(){ctx.fillStyle=bg;ctx.fillRect(0,0,c.width,c.height);items.forEach((o,i)=>{ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';if(o.type==='text'){ctx.fillStyle=o.color;ctx.font='800 '+o.size+'px system-ui';ctx.shadowColor='transparent';ctx.fillText(o.text,o.x*c.width,o.y*c.height,c.width*.88)}else if(o.type==='shape'){ctx.fillStyle=o.color;ctx.beginPath();ctx.roundRect(o.x*c.width-100,o.y*c.height-65,200,130,22);ctx.fill()}else if(o.type==='image'&&o.img){const maxW=c.width*.7,maxH=c.height*.55,scale=Math.min(maxW/o.img.width,maxH/o.img.height);ctx.drawImage(o.img,o.x*c.width-o.img.width*scale/2,o.y*c.height-o.img.height*scale/2,o.img.width*scale,o.img.height*scale)}if(i===selected){ctx.strokeStyle='#ec4899';ctx.lineWidth=Math.max(3,c.width/360);ctx.strokeRect(o.x*c.width-110,o.y*c.height-85,220,170)}ctx.restore()})}
function add(o){items.push(o);selected=items.length-1;sync();draw()}
function sync(){const o=items[selected];document.getElementById('x').value=o?o.x*100:50;document.getElementById('y').value=o?o.y*100:50}
document.getElementById('bg').oninput=e=>{bg=e.target.value;draw()};
document.getElementById('addText').onclick=()=>{const text=document.getElementById('txt').value.trim();if(!text)return;add({type:'text',text,color:document.getElementById('tc').value,size:Math.max(12,Math.min(220,+document.getElementById('ts').value||72)),x:.5,y:.5})};
document.getElementById('addShape').onclick=()=>add({type:'shape',color:document.getElementById('tc').value,x:.5,y:.5});
document.getElementById('image').onchange=e=>{const f=e.target.files[0];if(!f)return;const img=new Image();img.onload=()=>add({type:'image',img,x:.5,y:.5});img.src=URL.createObjectURL(f)};
['x','y'].forEach(k=>document.getElementById(k).oninput=e=>{if(selected<0)return;items[selected][k]=e.target.value/100;draw()});
document.getElementById('delete').onclick=()=>{if(selected<0)return;items.splice(selected,1);selected=Math.min(items.length-1,selected);sync();draw()};
document.getElementById('clear').onclick=()=>{items=[];selected=-1;sync();draw()};
document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{const [w,h]=b.dataset.size.split(',').map(Number);c.width=w;c.height=h;document.getElementById('sizeLabel').textContent=w+' × '+h;draw()});
c.onclick=e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;let best=-1,dist=Infinity;items.forEach((o,i)=>{const d=Math.hypot(o.x-x,o.y-y);if(d<dist){dist=d;best=i}});selected=dist<.2?best:-1;sync();draw()};
document.getElementById('download').onclick=()=>{const a=document.createElement('a');a.download='loox-design.png';a.href=c.toDataURL('image/png');a.click()};draw();
</script>  <script src="loox-tool-guides.js?v=1"></script>
  <script src="loox-tool-ui.js?v=2"></script>
</body></html>
