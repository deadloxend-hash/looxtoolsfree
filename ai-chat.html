<script defer src="loox-sitewide-nav.js?v=95"></script><script defer src="platform/loox-animated-prompts.js?v=1"></script><script defer src="platform/loox-unified-composer.js?v=7"></script><!-- AI Agent V98: mobile header order and account enforcement -->
<script>
(() => {
 const compact=window.matchMedia('(max-width:790px)');
 const svg='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16.4 16.4 4 4"/></svg>';
 const init=()=>{
  const header=document.querySelector('body.ai-chat > header.lig-header');
  const account=header?.querySelector('.lig-header-user[data-loox-account]');
  if(!header||!account)return;
  let busy=false;
  const reconcile=()=>{
   if(busy||!compact.matches)return;
   busy=true;
   try {
    header.classList.add('loox-chat-mobile-compact');
    const brand=header.querySelector('.lig-head-start');
    if(brand)brand.style.setProperty('margin-right','auto','important');
    let search=header.querySelector('.loox-chat-header-search');
    if(!search){
     search=document.createElement('button');
     search.type='button';search.className='loox-chat-header-search';
     search.setAttribute('aria-label','Search LOOX tools');
     search.innerHTML=svg;
     search.addEventListener('click',()=>document.querySelector('#loox-sitewide-header .loox-sitewide-search')?.click());
    }
    let apps=header.querySelector('.loox-mobile-app-native-trigger');
    // Sitewide loader creates the real working app-grid button.
    if(search&&search.parentElement!==header)header.append(search);
    if(apps&&apps.parentElement!==header)header.append(apps);
    if(search&&apps&&search.nextElementSibling!==apps)header.insertBefore(search,apps);
    if(apps&&apps.nextElementSibling!==account)header.insertBefore(apps,account);
    if(account.nextElementSibling)header.append(account);
    const important=(node,property,value)=>{if(node&&(node.style.getPropertyValue(property)!==value||node.style.getPropertyPriority(property)!=='important'))node.style.setProperty(property,value,'important');};
    [search,apps,account].forEach((node,i)=>important(node,'order',String(i+1)));
    important(account,'margin-left','0');
    important(account,'flex','0 0 auto');
    important(account,'width','auto');
    important(account,'max-width','44px');
    for(const node of account.querySelectorAll('.lx-credit-chip,.lx-upgrade,.lx-credit-bundle')){
     important(node,'display','none');
    }
    for(const node of [...account.children]){
     if(node.classList.contains('lx-profile-details'))continue;
     important(node,'display','none');
    }
    const profile=account.querySelector('.lx-profile-details');
    important(profile,'display','block');
    important(profile,'margin','0');
   }finally{busy=false}
  };
  reconcile();
  const observer=new MutationObserver(reconcile);
  observer.observe(header,{childList:true,subtree:true});
  compact.addEventListener?.('change',reconcile);
 };
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});
 else init();
})();
</script></body></html>
