<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOOX Tools - Free Professional Web Utilities</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #18191c; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 15px; }

    h1 { margin-bottom: 5px; font-size: 2.2rem; color: #3b82f6; text-align: center; }
    p.sub { color: #9ca3af; margin-bottom: 35px; font-size: 1rem; text-align: center; }

    .app-container { background: #22242a; border-radius: 12px; width: 100%; max-width: 900px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

    .hub-header { text-align: center; margin-bottom: 25px; }
    .hub-header h2 { font-size: 1.4rem; margin-bottom: 8px; color: #fff; }
    .hub-header p { color: #888; font-size: 0.95rem; }

    .tool-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
    .tool-card { background: #1a1c23; border: 2px solid #2e3248; border-radius: 10px; padding: 25px 20px; cursor: pointer; transition: 0.2s; text-decoration: none; display: block; }
    .tool-card:hover { border-color: #3b82f6; transform: translateY(-3px); background: #222633; }
    .tool-card h3 { color: #fff; margin-bottom: 8px; font-size: 1.2rem; }
    .tool-card p { color: #9ca3af; font-size: 0.88rem; line-height: 1.4; }
  </style>
</head>
<body>

  <h1>LOOX Tools</h1>
  <p class="sub">Professional Free Web Utilities</p>

  <div class="app-container">
    <div class="hub-header">
      <h2>Select a Tool</h2>
      <p>Choose an option below to start working.</p>
    </div>
    
    <div class="tool-grid">
      <!-- Links to the separate background remover page -->
      <a href="bg-remove.html" class="tool-card">
        <h3>✂️ Background Remover</h3>
        <p>Instant studio-grade AI cutouts powered by cloud precision.</p>
      </a>

      <!-- Future tools can easily be added here as separate HTML files later -->
    </div>
  </div>

</body>
</html>
