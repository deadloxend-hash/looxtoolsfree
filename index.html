  <script type="module">
    import imglyRemoveBackground from 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm';

    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const loader = document.getElementById('loader');
    const editorLayout = document.getElementById('editorLayout');
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');

    let originalImg = new Image();
    let cutoutImg = new Image();
    let currentTool = null; // 'erase' or 'restore'
    let isDrawing = false;
    let bgColor = 'transparent';
    let currentTab = 'removed';

    // File Upload Handler
    fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

    async function handleFile(file) {
      if (!file) return;
      
      dropZone.style.display = 'none';
      loader.style.display = 'block';

      const fileUrl = URL.createObjectURL(file);
      await loadOriginal(fileUrl);

      try {
        // Configure explicit CDN assets path to avoid fetching errors
        const config = {
          publicPath: 'https://cdn.jsdelivr.net/npm/@imgly/background-removal-data@1.5.5/dist/',
          progress: (key, current, total) => {
            if (total > 0) {
              const percent = Math.round((current / total) * 100);
              loader.innerText = `⚡ Downloading AI Model... ${percent}%`;
            }
          }
        };

        const blob = await imglyRemoveBackground(file, config);
        const cutoutUrl = URL.createObjectURL(blob);
        
        cutoutImg.onload = () => {
          loader.style.display = 'none';
          editorLayout.style.display = 'grid';
          renderCanvas();
        };
        cutoutImg.src = cutoutUrl;
      } catch (err) {
        console.error("BG Removal Error Details:", err);
        alert("Failed to process image. Check browser console (F12) for network logs.");
        resetApp();
      }
    }

    function loadOriginal(url) {
      return new Promise((resolve) => {
        originalImg.onload = resolve;
        originalImg.src = url;
      });
    }

    // Canvas Renderer
    function renderCanvas() {
      canvas.width = originalImg.width;
      canvas.height = originalImg.height;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (currentTab === 'original') {
        ctx.drawImage(originalImg, 0, 0);
        return;
      }

      if (bgColor !== 'transparent') {
        ctx.fillStyle = bgColor;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      ctx.drawImage(cutoutImg, 0, 0);
    }

    // Touch-Up Engine
    window.setTool = function(tool) {
      currentTool = currentTool === tool ? null : tool;
      document.getElementById('eraseBtn').classList.toggle('active', currentTool === 'erase');
      document.getElementById('restoreBtn').classList.toggle('active', currentTool === 'restore');
    };

    canvas.addEventListener('mousedown', () => isDrawing = true);
    canvas.addEventListener('mouseup', () => isDrawing = false);
    canvas.addEventListener('mousemove', draw);

    function draw(e) {
      if (!isDrawing || !currentTool || currentTab === 'original') return;

      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      const x = (e.clientX - rect.left) * scaleX;
      const y = (e.clientY - rect.top) * scaleY;
      const radius = document.getElementById('brushSize').value;

      const offCanvas = document.createElement('canvas');
      offCanvas.width = canvas.width;
      offCanvas.height = canvas.height;
      const offCtx = offCanvas.getContext('2d');

      offCtx.drawImage(cutoutImg, 0, 0);
      offCtx.beginPath();
      offCtx.arc(x, y, radius, 0, Math.PI * 2);

      if (currentTool === 'erase') {
        offCtx.globalCompositeOperation = 'destination-out';
        offCtx.fill();
      } else if (currentTool === 'restore') {
        offCtx.globalCompositeOperation = 'source-over';
        offCtx.save();
        offCtx.clip();
        offCtx.drawImage(originalImg, 0, 0);
        offCtx.restore();
      }

      const updatedImg = new Image();
      updatedImg.onload = () => {
        cutoutImg = updatedImg;
        renderCanvas();
      };
      updatedImg.src = offCanvas.toDataURL();
    }

    window.switchTab = function(tab) {
      currentTab = tab;
      document.getElementById('tabRemoved').classList.toggle('active', tab === 'removed');
      document.getElementById('tabOriginal').classList.toggle('active', tab === 'original');
      renderCanvas();
    };

    window.setBgColor = function(color) {
      bgColor = color;
      renderCanvas();
    };

    window.downloadImage = function() {
      const link = document.createElement('a');
      link.download = 'loox-bg-removed.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    };

    window.resetApp = function() {
      location.reload();
    };
  </script>
