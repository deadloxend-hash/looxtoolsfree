<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOOXToolFree Guides — Image, Video and Audio Tutorials</title><meta name="description" content="Learn how to edit images, trim video, compress files and create graphics with practical LOOX tool tutorials."><link rel="canonical" href="https://deadloxend-hash.github.io/looxtoolsfree/guides.html"><style>:root{color-scheme:dark}body{margin:0;background:#10111c;color:#f7f4ff;font:15px system-ui}main{max-width:1060px;margin:auto;padding:40px 24px}h1{font-size:clamp(32px,5vw,55px)}p,li{line-height:1.8;color:#c4bdd4}a{color:#b99dff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}article{border:1px solid #38344b;background:#1b1b2a;padding:23px;border-radius:18px}h2{font-size:21px}h3{font-size:16px}header{padding:20px 30px;background:#191827}header a{font-weight:900;text-decoration:none}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header><a href="index.html">LOOX Tools</a></header><main><h1>Creative tools, explained clearly.</h1><p>Learn practical workflows and how to review the results before you publish. Some tools process files locally; cloud-powered features send selected files to external services.</p><section class="grid" id="guides"></section></main><script>const data=[['video-editor','Video Editor','Import a supported video, choose trim points, add a title and export WebM.','Confirm that your browser supports the source codec and WebM recording. Check the exported file for audio.'],['bg-remove','Background Remover','Upload a photo with a clear subject and remove its background.','Check edges around hair, glass and transparent materials. Cloud processing is used.'],['photo-editor','Photo Editor','Open an image, adjust the available settings and save a copy.','Work from a high-quality original and check fine details at full size.'],['design-studio','Design Studio','Choose a canvas, add images and text, and export a design.','Keep important elements inside safe margins for social media and thumbnails.'],['faceswap','Face Swap','Choose source and target images with permission to edit both.','Match lighting and head angles; never use results to impersonate or deceive.'],['image-compressor','Image Compressor','Select a supported image and compare compressed output.','Compression can affect small text and gradients; inspect the result before publishing.'],['cropimage','Crop Image','Choose the desired aspect ratio and reposition the crop.','Keep the main subject away from the edges.'],['imgformatconverter','Image Format Converter','Choose an input and output image format.','Use PNG for transparency and JPEG for typical photographs.'],['video-compressor','Video Compressor','Choose a supported video and reduce file size.','Test short clips first and confirm playback and audio.'],['video-to-gif','Video to GIF','Convert a short moment from a video into a GIF.','Short loops and smaller dimensions help control file size.'],['video-to-mp3','Video to MP3','Extract an audio track from a supported video.','Check that the original has audio and that your browser supports the codec.'],['video-trimmer','Video Trimmer','Choose start and end times to keep the important footage.','Review the cut and test the downloaded file.'],['youtube-thumbnail-maker','Thumbnail Maker','Create a thumbnail with readable text and a focal image.','Check readability at mobile thumbnail size.'],['face-blur','Face Blur','Blur visible faces in a photo before sharing.','Inspect all faces and check whether the blur is strong enough.'],['toolbox','More Utilities','Explore document, audio and file conversion tools.','Review input formats and processing notes for each utility.']];document.getElementById('guides').innerHTML=data.map(([url,name,step,tip])=>'<article><h2>'+name+'</h2><h3>How to use it</h3><ol><li>Prepare an original file you have permission to use.</li><li>'+step+'</li><li>Preview the result, adjust settings and download.</li></ol><h3>Quality tip</h3><p>'+tip+'</p><p><a href="'+url+'.html">Open '+name+' →</a></p></article>').join('')</script><script src="loox-navigation.js?v=1"></script></body></html>
